name: ipes
description: "iPES — intelligent personal e-library. Prototype of the core flow: import, catalogue, search, export."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ">=4.0.0 <5.0.0"
  characters: ^1.3.0
  collection: ^1.18.0
  crypto: ^3.0.3
  file_picker: ">=12.0.0 <13.0.0"
  flutter_onnxruntime: 1.8.5
  path_provider: ^2.1.4
  xml: ">=6.5.0 <8.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <8.0.0"

flutter:
  uses-material-design: true
